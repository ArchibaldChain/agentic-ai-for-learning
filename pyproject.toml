[project]
name = "agentic-ai"
version = "0.1.0"
description = "Personal agentic AI system with RAG and AWS Bedrock"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34.0",
    "langchain-community>=0.0.20",
    "pypdf>=3.17.0",
    "python-docx>=1.1.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "weaviate-client>=4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
azure = [
    "openai>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_ai"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
